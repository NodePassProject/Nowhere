[package]
name = "nowhere"
version = "2.0.0-dev"
edition = "2024"
description = "One-port, two-transport encrypted relay with independently split directions"
license = "GPL-3.0-only"
repository = "https://github.com/NodePassProject/Nowhere"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
getrandom = "0.4.3"
hmac = "0.13.0"
humantime = "2.4.0"
libc = "0.2.189"
percent-encoding = "2.3.2"
quinn = { version = "0.11.11", default-features = false, features = ["bloom", "log", "runtime-tokio", "rustls-ring"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = "0.6.5"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = "0.7.19"
url = "2.5.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
